<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>SK Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><img src="sk-logo.jpg" alt=""><div><b>SK HOME</b><span id="date"></span></div></div>
    <div class="clock" id="clock">--:--</div>
    <div class="info">
      <div class="chip" id="weather"><span>Weather…</span></div>
      <div class="chip" id="heating"><span>Heating…</span></div>
    </div>
  </header>
  <main>
    <h2>Watch</h2>
    <div class="grid" id="grid"></div>
  </main>
  <footer><span id="status">Arrows to move, OK to open</span></footer>
</div>
<script src="app.js"></script>
</body>
</html>
